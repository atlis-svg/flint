[package]
name = "flint"
version = "0.1.1"
edition = "2024"
description = "Flint — one app, lots: 2D vector animation and game editor, player and Hub client"
license = "MIT OR Apache-2.0"
repository = "https://github.com/atlis-svg/flint"
readme = "README.md"
keywords = ["animation", "vector", "egui", "flash", "gamedev"]
categories = ["multimedia::images", "game-development", "graphics"]
publish = false

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.22"
eframe = "0.37"
egui = "0.37"
epaint_default_fonts = "0.37.0"
flate2 = "1.1.10"
gif = "0.14.2"
rfd = "0.17.2"
rhai = "1.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
ureq = { version = "2", features = ["json"] }

# Fast iteration: optimized deps, light opt for our code, quick incremental rebuilds.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
codegen-units = 16
incremental = true
strip = true
